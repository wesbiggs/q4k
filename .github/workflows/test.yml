# Build everything and run tools/test.sh on every push, to any branch.
#
# VICE is built from source with its headless UI: no window, no display
# server, and the C64 ROMs come with it (distribution packages leave them
# out). cc65 is built from source too, pinned to the version used locally.
# Both land in $HOME and are cached, so only the first run pays for them.

name: test

on:
  push:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  VICE_VERSION: "3.10"
  CC65_VERSION: "2.19"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/vice
            ~/cc65
          key: toolchain-${{ runner.os }}-vice${{ env.VICE_VERSION }}-headless-cc65${{ env.CC65_VERSION }}

      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config flex bison dos2unix xa65 texinfo

      - name: Build cc65
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "V$CC65_VERSION" \
              https://github.com/cc65/cc65.git /tmp/cc65
          make -C /tmp/cc65 -j"$(nproc)" PREFIX="$HOME/cc65"
          make -C /tmp/cc65 install PREFIX="$HOME/cc65"

      - name: Build VICE (headless)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/vice.tgz \
              "https://sourceforge.net/projects/vice-emu/files/releases/vice-$VICE_VERSION.tar.gz/download"
          tar -xzf /tmp/vice.tgz -C /tmp
          cd "/tmp/vice-$VICE_VERSION"
          ./configure --prefix="$HOME/vice" --enable-headlessui \
              --disable-html-docs --without-pulse --without-alsa \
              --without-png --without-libcurl
          make -j"$(nproc)"
          make install

      - name: Put the toolchain on the PATH
        run: |
          echo "$HOME/cc65/bin" >> "$GITHUB_PATH"
          echo "$HOME/vice/bin" >> "$GITHUB_PATH"

      - name: Build
        run: make

      - name: Test
        run: make test
