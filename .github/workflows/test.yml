# SPDX-License-Identifier: GPL-3.0-or-later
# Build everything and run tools/test.sh on every push, to any branch.
#
# cc65 2.19 and VICE 3.10 built headless (no window, no display server,
# the C64 ROMs included) come from wesbiggs/c64-cloud-toolchain, which
# keeps them in this repository's Actions cache.

name: test

on:
  push:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# The suite is split in two (tools/test.sh's group_of()), each on a
# machine of its own, and each half runs its cases several at a time.
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [goldens, cases]

    steps:
      - uses: actions/checkout@v5

      # cc65 and the headless VICE 3.10, cached by the toolchain's release.
      # The tag is tools/cloud-setup.sh's TOOLCHAIN too: move them together.
      - uses: wesbiggs/c64-cloud-toolchain@v1.0.1

      - name: Build
        run: make

      - name: Test
        run: make test TESTARGS="--group ${{ matrix.group }}"
