# Build the headless VICE that tools/cloud-setup.sh installs, and publish it
# as a release asset so a cloud session can download it in seconds instead
# of building it for minutes.
#
# It runs cloud-setup.sh itself with the build forced, so what is published
# is exactly what the script would have built, and then builds q4k and
# checks one screen with it before uploading anything. Runs by hand, and
# whenever the script or this file changes. A second job checks the path
# taken without a token: Ubuntu's VICE plus the ROMs from VICE's source.

name: toolchain

on:
  workflow_dispatch:
  push:
    paths:
      - tools/cloud-setup.sh
      - .github/workflows/toolchain.yml

concurrency:
  group: toolchain
  cancel-in-progress: false

permissions:
  contents: write

env:
  VICE_VERSION: "3.10"

jobs:
  vice:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Set up the toolchain from source
        run: sudo Q4K_FROM_SOURCE=1 tools/cloud-setup.sh

      - name: Check it builds and runs q4k
        run: |
          make
          tools/screendump.py dist/hello.prg | diff -u tests/golden/hello.txt -

      - name: Pack
        run: tar -czf "vice-$VICE_VERSION-headless.tgz" -C / opt/vice

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="toolchain-vice$VICE_VERSION"
          # A pre-release, so it is never the one GitHub calls "Latest":
          # that link is for players, and points at the game.
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
                 --title "Toolchain: VICE $VICE_VERSION (headless)" \
                 --notes "Headless VICE for tools/cloud-setup.sh, built on ubuntu-24.04 into /opt/vice. Not a game release."
          gh release edit "$tag" --prerelease
          gh release upload "$tag" "vice-$VICE_VERSION-headless.tgz" --clobber

  # The path a cloud session without a token takes: Ubuntu's VICE, the ROMs
  # out of the VICE source tarball, and the Xvfb wrapper. No token reaches
  # the script here, so it cannot take the prebuilt release instead.
  ubuntu-vice:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up the toolchain with Ubuntu's VICE
        run: sudo tools/cloud-setup.sh

      - name: Check it builds and runs q4k
        run: |
          make
          make d64 d64-online
          tools/screendump.py dist/hello.prg | diff -u tests/golden/hello.txt -
          tools/screendump.py dist/q4k.prg --disk dist/q4k.d64 \
              --keys 'Alaric\rwwwwwwwwwwwwaaaaw' \
              --settle 3 | diff -u tests/golden/q4k.txt -
