# ow-isles: the open sea's islands' drawing (src/isl/isl_draw.s), which runs
# under the KERNAL at ISL_CODE (q4k/isles.h), where the bootstrap loads it
# beside the table it makes. It runs nowhere else and calls nothing.

MEMORY {
    LOADADDR: file = %O, start = $F45E, size = $0002;
    ISL:      file = %O, start = $F460, size = $01A0;
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    ISLCODE:  load = ISL,      type = ro;
}
