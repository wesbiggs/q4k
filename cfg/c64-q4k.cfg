# q4k C64 memory layout.
#
# Derived from cc65's stock c64.cfg with one change: __HIMEM__ drops from
# $D000 to $CF00, carving out the top page of free RAM ($CF00-$CFFF) so the
# C runtime (whose 2K stack grows down from __HIMEM__) can never touch it.
#
# That page is the PROBE page -- a debug/test mailbox the program writes to
# and tools/screendump.py reads over VICE's binary monitor. See
# include/q4k/probe.h for the layout.
#
#   $0002-$001B  zero page (cc65)
#   $0400-$07E7  screen matrix (VIC bank 0)
#   $0801-$37FF  BASIC stub, code, rodata, data       (~12K)
#   $3800-$3FFF  CHARSET: 256 chars x 8 bytes         <-- reserved here
#   $4000-$C4FF  BSS: uninitialised game state        (~33K)
#   $C500-$C6FF  KERNAL RS-232 receive/transmit buffers
#   $C700-$CEFF  C stack (2K, grows down from __HIMEM__)
#   $CF00-$CFFF  PROBE page                           <-- reserved here
#   $D000-$DFFF  I/O (VIC-II, SID, CIA, colour RAM)
#
# The charset must live inside the VIC's 16K bank 0 ($0000-$3FFF) alongside
# the screen, and cannot sit at $1000 or $1800 -- the VIC sees character ROM
# shadowed there regardless of what RAM holds. $3800 is the top slot in the
# bank and keeps the whole of $4000 upward free for game state.
#
# Code and data are capped at $3800 so an overflow is a link error rather
# than a charset that mysteriously fills with program text.

FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0800; # 2k stack
    __HIMEM__:     type = weak, value = $CF00;   # $CF00-$CFFF reserved: see PROBE above
    __CHARSET__:   type = weak, value = $3800;   # $3800-$3FFF reserved: see CHARSET above
    __RSBUF__:     type = weak, value = $C500;   # $C500-$C6FF reserved: see RS-232 below
#
# The KERNAL carves its two 256-byte RS-232 buffers out of the top of BASIC
# memory, wherever MEMSIZ ($0283) points, the moment the port is opened.
# modem_open() sets MEMSIZ to $C700 so they land in this reserved window
# instead of in the middle of game state.
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $001A;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = __CHARSET__ - __HEADER_LAST__;
    BSS:      file = "",               start = $4000,           size = __RSBUF__ - $4000;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = rw;
    ONCE:     load = MAIN,     type = ro,  define   = yes;
    BSS:      load = BSS,      type = bss, define   = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
