# Quest for the King -- C64 memory layout.
#
# Derived from cc65's stock c64.cfg. Three things move:
#
#   1. The character set is pinned at $3800, inside the VIC's default bank 0
#      and out of the C runtime's reach. It cannot sit at $1000 or $1800 --
#      the VIC sees character ROM shadowed there whatever RAM holds.
#   2. Code and rodata are capped below it, and a filler region keeps the PRG
#      one contiguous load across the gap.
#   3. Everything above the charset is a second file-backed region, HIGH, for
#      bulk data (maps, tables) and for module code that will not fit below.
#      Twelve kilobytes under the charset is not enough for this game.
#      HIGH runs on into $A000-$B7FF, the RAM under BASIC ROM: the cc65
#      startup banks BASIC out, and LOAD writes RAM there regardless. The
#      price is BSS headroom -- $B800 leaves it about 120 bytes spare.
#
#   $0002-$001B  zero page (cc65)
#   $0400-$07E7  screen matrix (VIC bank 0)
#   $0801-$37FF  MAIN: BASIC stub, code, rodata, data     (12K)
#   $3800-$3FFF  CHARSET: 256 chars x 8 bytes, built at runtime
#   $4000-$B7FF  HIGH: HICODE + HIDATA                    (30K)
#   $B800-$CCFF  BSS: uninitialised game state            (5.2K)
#   $CD00-$CEFF  KERNAL RS-232 receive/transmit buffers
#   $CF00-$CFFF  PROBE page (debug mailbox, see include/q4k/probe.h)
#   $D000-$DFFF  I/O (VIC-II, SID, CIA, colour RAM) -- and under it, RAM
#                the home continent, 64 by 64, kept there (src/lib/vault.s)
#   $E000-$FFFF  KERNAL ROM, and under it RAM: the continent put away while
#                a town or a dungeon is in local[] (also vault.s)
#
# The KERNAL carves its two 256-byte RS-232 buffers out of the top of BASIC
# memory, wherever MEMSIZ ($0283) points, the moment the port is opened.
# modem_open() sets MEMSIZ to $CF00 so they land in the reserved window
# instead of in the middle of game state.
#
# The C stack is NOT up here, whatever this file once said: cc65's startup
# points it at the top of MAIN, $3800, and it grows down through whatever
# MAIN has left (the ONCE segment, dead after start-up, and the spare bytes
# after it). Measured, nothing ever wrote to $C700-$CEFF, which is why that
# 2K could be given to HIGH and BSS. Keep MAIN's free space in mind as stack.

FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0800;   # (see the note on the stack)
    __HIMEM__:     type = weak, value = $CF00;   # $CF00-$CFFF is the probe page
    __CHARSET__:   type = weak, value = $3800;
    __HIGH__:      type = weak, value = $4000;
    # The overlay, at the bottom of HIGH: what runs once at start-up and,
    # afterwards, the scratch arrays of the fights and the dialogue (see
    # src/lib/overlay.s). Its size is the arrays' total, which must be no
    # less than what start-up needs; BSS starts that much higher than it
    # did, having lost them, so any excess is lost to the game.
    __OVLSIZE__:   type = weak, value = $09EC;
    # BSS2 (below) holds 192 bytes that used to be BSS, so HIGH takes them.
    __HIGHTOP__:   type = weak, value = $B800 + __OVLSIZE__ + $00C0;
    __RSBUF__:     type = weak, value = $CD00;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $001A;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;

    # fill = yes so CHARPAD and HIGH stay contiguous with MAIN in the file;
    # a PRG is a single run of bytes from one load address.
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = __CHARSET__ - __HEADER_LAST__, fill = yes;
    # The charset, in six pieces. Its reverse-video half is mostly glyphs the
    # game never draws, and charset_install() leaves them alone, so three runs
    # of them -- CH1, CH2, CH3 -- are free for data that is only read.
    # ($92-$9F, $A1-$BF and $C8-$FF; $A0 is the input cursor and $C0-$C7 the
    # bow shot's sprite block.)
    CHARPAD0: file = %O, define = yes, start = __CHARSET__,     size = $0490, fill = yes;
    CH1:      file = %O, define = yes, start = $3C90,           size = $0070, fill = yes;
    CHARPAD1: file = %O, define = yes, start = $3D00,           size = $0008, fill = yes;
    CH2:      file = %O, define = yes, start = $3D08,           size = $00F8, fill = yes;
    CHARPAD2: file = %O, define = yes, start = $3E00,           size = $0040, fill = yes;
    CH3:      file = %O, define = yes, start = $3E40,           size = $01C0, fill = yes;
    OVL:      file = %O, define = yes, start = __HIGH__,        size = __OVLSIZE__, fill = yes;
    HIGH:     file = %O, define = yes, start = __HIGH__ + __OVLSIZE__, size = __HIGHTOP__ - __HIGH__ - __OVLSIZE__;

    BSS:      file = "",               start = __HIGHTOP__,     size = __RSBUF__ - __HIGHTOP__;
    # What is left of the probe page: it uses $CF00-$CF13 (see probe.h).
    BSS2:     file = "",               start = $CF14,           size = $00EC;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = rw;
    ONCE:     load = MAIN,     type = ro,  define   = yes;

    # Above the charset: bulk tables and overflow code.
    BSS2:     load = BSS2,     type = bss, optional = yes;
    HICODE:   load = HIGH,     type = ro,  optional = yes;
    HIDATA:   load = HIGH,     type = ro,  optional = yes;

    # The title screen runs once, before the first fight, from the place the
    # fights later keep their scratch (OVL): see src/lib/overlay.s.
    TITLECODE: load = OVL,     type = ro,  optional = yes;
    TITLEDATA: load = OVL,     type = ro,  optional = yes;

    # In the charset's spare glyphs (see MEMORY): 112, 248 and 448 bytes.
    CHDATA1:  load = CH1,      type = ro,  optional = yes;
    CHDATA2:  load = CH2,      type = ro,  optional = yes;
    CHDATA3:  load = CH3,      type = ro,  optional = yes;

    BSS:      load = BSS,      type = bss, define   = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
