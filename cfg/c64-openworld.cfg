# Quest for the King -- the smooth-scrolling prototype (src/openworld.c).
#
# One flat load, like cfg/c64-flat.cfg, but with VIC bank 1 kept for the
# scrolling screens (src/lib/smooth.s), and the map below BSS:
#
#   $0801-$3FFF  MAIN: BASIC stub, code, rodata, data; the C stack at its top
#   $4000-$4FFF  VIC: screens A and B, the multicolour character set,
#   $5000-$53FF       the hero's sprite blocks -- all made at runtime
#   $5400-$9FFF  HIGH: the land generator's code and tables
#   $A000-$AFFF  SHORE: the land round each water square, for the beaches
#   $B000-$BFFF  WORLD: home, 64 by 64, copied out of the vault
#   $C000-$CEFF  BSS
#   $CF00-$CFFF  PROBE page, and BSS2 above what the probe uses
#   $D000-$FFF9  the vault, where the generator builds home

FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0400;
    __HIMEM__:     type = weak, value = $CF00;
    __SLOT_START__: type = export, value = $5400;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $001A;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = $4000 - __HEADER_LAST__, fill = yes;
    VIC:      file = %O,               start = $4000,           size = $1400, fill = yes;
    HIGH:     file = %O, define = yes, start = $5400,           size = $A000 - $5400;
    BSS:      file = "",               start = $C000,           size = $CF00 - $C000;
    BSS2:     file = "",               start = $CF14,           size = $00EC;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = rw;
    ONCE:     load = MAIN,     type = ro,  define   = yes;

    BSS2:     load = BSS2,     type = bss, optional = yes;
    HICODE:   load = HIGH,     type = ro,  optional = yes;
    HIDATA:   load = HIGH,     type = ro,  optional = yes;
    TITLECODE: load = HIGH,    type = ro,  optional = yes;
    TITLEDATA: load = HIGH,    type = ro,  optional = yes;
    MAPCODE:   load = HIGH,    type = ro,  optional = yes;
    MAPDATA:   load = HIGH,    type = ro,  optional = yes;
    FIGHTCODE: load = HIGH,    type = ro,  optional = yes;
    FIGHTDATA: load = HIGH,    type = ro,  optional = yes;
    TALKCODE:  load = HIGH,    type = ro,  optional = yes;
    TALKDATA:  load = HIGH,    type = ro,  optional = yes;
    SHOPCODE:  load = HIGH,    type = ro,  optional = yes;
    SHOPDATA:  load = HIGH,    type = ro,  optional = yes;
    MAPADDR:   load = HIGH,    type = ro,  optional = yes;
    FIGHTADDR: load = HIGH,    type = ro,  optional = yes;
    TALKADDR:  load = HIGH,    type = ro,  optional = yes;
    SHOPADDR:  load = HIGH,    type = ro,  optional = yes;
    CHDATA1:   load = HIGH,    type = ro,  optional = yes;
    CHDATA2:   load = HIGH,    type = ro,  optional = yes;
    CHDATA3:   load = HIGH,    type = ro,  optional = yes;

    BSS:      load = BSS,      type = bss, define   = yes;
    FIGHTBSS: load = BSS,      type = bss, optional = yes;
    TALKBSS:  load = BSS,      type = bss, optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
