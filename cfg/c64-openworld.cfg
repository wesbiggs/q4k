# Quest for the King -- the smooth-scrolling prototype (src/openworld.c).
#
# One flat load, like cfg/c64-flat.cfg, but with VIC bank 1 kept for the
# scrolling screens (src/lib/smooth.s), and the map below BSS:
#
#   $0334-$03FF  the C stack (openworld.c's main() moves it there)
#   $0400-$07FF  LOW: code copied out of screen A's space once the land is
#                built (the start's messages are on the text screen till then)
#   $0801-$3FFF  MAIN: BASIC stub, code, rodata, data
#   $4000-$4FFF  VIC: screens A and B, the multicolour character set,
#   $5000-$527F       the sprite blocks (ten) -- all made at runtime
#   $5280-$53FF  VICTOP: a little code, past the sprites
#   $5400-$59FF  HIGH: code that will not fit below. These two are a file
#                of their own (%O.hi), which the engine loads first thing,
#                so that the engine's own file stops at MAIN's end rather
#                than carrying the screens' 5K of nothing to the disk
#   $5A00-$7FFF  SLOT: the world's overlay, the town's or the dungeon's
#                (src/ow/engine.h), each a file of its own (%O.world,
#                %O.town, %O.dungeon), loaded by the engine as the hero
#                goes in and out of places. It ends with VIC bank 1, since
#                the dungeon's monsters' pictures (OVDART) are sprites
#   $8000-$87FF  LOCAL: local[], a place's map (HIDATA: in the game it is
#                the font image first, which nothing here reads, so it is
#                not in the file)
#   $8800-$9FFF  COMMON: the tables the tile sets share, the towns' maps
#                and every module's constants (RODATA), which are the
#                same bytes in both engines, so they are a file of their
#                own, OW-DATA, that the bootstrap loads once (ow.h). ld65
#                writes it beside each engine (%O.data), with its load
#                address in front, and the Makefile checks the two agree
#   $A000-$AFFF  SHORE: the land round each water square, for the beaches;
#                and a tile set's file (t.*) on the way into an area
#   $B000-$BFFF  WORLD: home, 64 by 64, copied out of the vault
#   $C000-$CE3E  BSS
#   $CE3F-$CEFF  GAME: the game block (q4k/owgame.h), which every program of
#                the open world leaves alone; its party is `party`
#   $CF00-$CFFF  PROBE page, and BSS2 above what the probe uses
#   $D000-$FFF9  the vault, where the generator builds home

FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0400;
    __HIMEM__:     type = weak, value = $CF00;
    __SLOT_START__: type = export, value = $5400;
    _party:        type = export, value = $CE3F;   # the game block's (owgame.h)
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $001A;
    LOADADDR: file = %O,               start = $042E,           size = $0002;
    # The engine's file starts in the KERNAL's text screen ($0400), which the
    # engine does not show: status.c's code, past the row load_failed()
    # writes (the top one), and sprite 0's pointer at $07F8, which the disk
    # icon (ow_disk.s) is showing while this loads (OWSPTR).
    LOWM:     file = %O,               start = $0430,           size = $03D1, fill = yes;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    LOW:      file = "",               start = $0400,           size = $0400;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = $4000 - __HEADER_LAST__;
    VIC:      file = "",               start = $4000,           size = $1280;
    HIADDR:   file = "%O.hi",          start = $527E,           size = $0002;
    VICTOP:   file = "%O.hi", define = yes, start = $5280,      size = $0180, fill = yes;
    HIGH:     file = "%O.hi", define = yes, start = $5400,      size = $0600;
    WADDR:    file = "%O.world",       start = $59FE,           size = $0002;
    SLOTW:    file = "%O.world", define = yes, start = $5A00,   size = $2600;
    TADDR:    file = "%O.town",        start = $59FE,           size = $0002;
    SLOTT:    file = "%O.town",  define = yes, start = $5A00,   size = $2600;
    DADDR:    file = "%O.dungeon",     start = $59FE,           size = $0002;
    SLOTD:    file = "%O.dungeon", define = yes, start = $5A00, size = $2600;
    LOCAL:    file = "",               start = $8000,           size = $0800;
    COMHDR:   file = "%O.data",        start = $87FE,           size = $0002;
    COMMON:   file = "%O.data", define = yes, start = $8800,    size = $A000 - $8800;
    BSS:      file = "",               start = $C000,           size = $CE3F - $C000;
    BSS2:     file = "",               start = $CF14,           size = $00EC;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = COMMON,   type = ro;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = rw;
    ONCE:     load = MAIN,     type = ro,  define   = yes;

    BSS2:     load = BSS2,     type = bss, optional = yes;
    OWTOP:    load = VICTOP,   type = ro,  optional = yes;
    OWLO:     load = LOWM,     type = ro;
    OWSPTR:   load = LOWM,     type = ro,  start = $07F8;
    OWLOW:    load = VIC, run = LOW, type = ro, define = yes, optional = yes;
    HICODE:   load = HIGH,     type = ro,  optional = yes;
    HIDATA:   load = LOCAL,    type = ro,  optional = yes;
    OWADDR:   load = COMHDR,   type = ro;
    OWHIADDR: load = HIADDR,   type = ro;
    OWDATA:   load = COMMON,   type = ro;
    TITLECODE: load = HIGH,    type = ro,  optional = yes;
    TITLEDATA: load = HIGH,    type = ro,  optional = yes;
    MAPCODE:   load = MAIN,    type = ro,  optional = yes;
    OVWADDR:   load = WADDR,   type = ro;
    OVWHEAD:   load = SLOTW,   type = ro;
    OVWCODE:   load = SLOTW,   type = ro;
    OVTADDR:   load = TADDR,   type = ro;
    OVTHEAD:   load = SLOTT,   type = ro;
    OVTCODE:   load = SLOTT,   type = ro;
    OVDADDR:   load = DADDR,   type = ro;
    OVDHEAD:   load = SLOTD,   type = ro;
    OVDCODE:   load = SLOTD,   type = ro;
    OVDART:    load = SLOTD,   type = ro,  align = $40;
    MAPDATA:   load = COMMON,  type = ro,  optional = yes;
    FIGHTCODE: load = HIGH,    type = ro,  optional = yes;
    FIGHTDATA: load = HIGH,    type = ro,  optional = yes;
    TALKCODE:  load = HIGH,    type = ro,  optional = yes;
    TALKDATA:  load = COMMON,  type = ro,  optional = yes;
    SHOPCODE:  load = HIGH,    type = ro,  optional = yes;
    SHOPDATA:  load = HIGH,    type = ro,  optional = yes;
    MAPADDR:   load = HIGH,    type = ro,  optional = yes;
    FIGHTADDR: load = HIGH,    type = ro,  optional = yes;
    TALKADDR:  load = HIGH,    type = ro,  optional = yes;
    SHOPADDR:  load = HIGH,    type = ro,  optional = yes;
    CHDATA1:   load = COMMON,  type = ro,  optional = yes;
    CHDATA2:   load = HIGH,    type = ro,  optional = yes;
    CHDATA3:   load = HIGH,    type = ro,  optional = yes;

    ALIGNBSS: load = BSS,      type = bss, align = $100, optional = yes;
    BSS:      load = BSS,      type = bss, define   = yes;
    FIGHTBSS: load = BSS,      type = bss, optional = yes;
    TALKBSS:  load = BSS,      type = bss, optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
