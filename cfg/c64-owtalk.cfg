# Quest for the King -- owtalk, the open world's conversations (src/owtalk.c).
# cfg/c64-owtown.cfg's layout, with the program's code below $4000: its
# own, the talk's, and the charset at $3800 with read-only data in its
# spare glyphs. BSS is at $B000, as owtown's is: above OW-DATA
# ($8800-$92FF), which ow_back() loads again while the REU cache's scratch
# is in use, and below the game block at $CE37 (q4k/owgame.h). The music
# under the KERNAL and the vault under the I/O area are not reached.
#
# A speaker with a portrait (src/ow/talkpic.c) is shown in VIC bank 1,
# $4000-$7FFF, which then belongs to the picture: what the file brings there
# (HIGH) is read only at the start -- the font image, charset_install(), and
# actor.c's and town_data.c's tables (the name the talk shows is copied
# first: npc_names[]' letters are in MAPDATA) -- or is PICCODE, the
# picture's code, which owtalk.c copies out to PICRUN before anything else.
# The portrait loads at $8000-$AFFF (tools/mkportrait.py), the engines'
# local[] and OW-DATA, which ow_back() loads again. cc65's zero page starts
# at $03, since the pictures' kernels write $02.
FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0800;   # (see the note on the stack)
    __HIMEM__:     type = weak, value = $CF00;   # $CF00-$CFFF is the probe page
    __CHARSET__:   type = weak, value = $3800;
    __HIGHTOP__:   type = weak, value = $B000;
    __PICRUN__:    type = weak, value = $BE00;
    __RSBUF__:     type = weak, value = $CD00;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0003,           size = $001A;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;

    # fill = yes so the CHARPADs stay contiguous with MAIN in the file;
    # a PRG is a single run of bytes from one load address.
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = __CHARSET__ - __HEADER_LAST__, fill = yes;
    # The charset, in six pieces. Its reverse-video half is mostly glyphs the
    # game never draws, and charset_install() leaves them alone, so three runs
    # of them -- CH1, CH2, CH3 -- are free for data that is only read.
    # ($92-$9F, $A1-$BF and $CB-$FF; $A0 is the input cursor, $C0-$C7 the
    # bow shot's sprite block, and $C8-$CA the party's classes.)
    CHARPAD0: file = %O, define = yes, start = __CHARSET__,     size = $0490, fill = yes;
    CH1:      file = %O, define = yes, start = $3C90,           size = $0070, fill = yes;
    CHARPAD1: file = %O, define = yes, start = $3D00,           size = $0008, fill = yes;
    CH2:      file = %O, define = yes, start = $3D08,           size = $00F8, fill = yes;
    CHARPAD2: file = %O, define = yes, start = $3E00,           size = $0058, fill = yes;
    CH3:      file = %O, define = yes, start = $3E58,           size = $01A8, fill = yes;
    # Past the charset, in the file: the font image that charset_install()
    # copies to $3800 and that code, which run once at the start; actor.c's
    # and town_data.c's tables; and PICCODE, copied out to PICRUN. All of it
    # is the portrait's once a talk with one starts (see the top).
    HIGH:     file = %O, define = yes, start = $4000,           size = $3000;

    BSS:      file = "",               start = __HIGHTOP__,     size = __PICRUN__ - __HIGHTOP__;
    # The portrait's code (PICCODE), copied here from HIGH at the start.
    PICRUN:   file = "", define = yes, start = __PICRUN__,      size = __RSBUF__ - __PICRUN__;
    # What is left of the probe page: it uses $CF00-$CF13 (see probe.h).
    BSS2:     file = "",               start = $CF14,           size = $00EC;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = rw;
    ONCE:     load = MAIN,     type = ro,  define   = yes;

    # Above the charset: bulk tables and overflow code.
    BSS2:     load = BSS2,     type = bss, optional = yes;
    HICODE:   load = MAIN,     type = ro,  optional = yes;
    HIDATA:   load = HIGH,     type = ro,  optional = yes;

    # The segments named for the game's engines (the Makefile's ENG_ lists).
    # (charset_install(), which runs first thing, never after a fight: up
    # there, for the room below that the party screen's figures want.)
    TITLECODE: load = HIGH,    type = ro,  optional = yes;
    TITLEDATA: load = HIGH,    type = ro,  optional = yes;
    PICCODE:   load = HIGH,    run = PICRUN, type = rw, define = yes, optional = yes;
    MAPCODE:   load = MAIN,    type = ro,  optional = yes;
    MAPDATA:   load = HIGH,    type = ro,  optional = yes;
    FIGHTCODE: load = MAIN,    type = ro,  optional = yes;
    FIGHTDATA: load = MAIN,    type = ro,  optional = yes;
    # (The talk's code is above the charset: no talk follows a fight.)
    TALKCODE:  load = MAIN,    type = ro,  optional = yes;
    # The party screen's figures (src/lib/ow_figs.s): sprite blocks, which
    # the VIC must see, so in bank 0 and past its character ROM at
    # $1000-$1FFF (the file asserts both).
    OWFIGS:    load = MAIN,    type = ro,  align = $40, optional = yes;
    TALKDATA:  load = MAIN,    type = ro,  optional = yes;
    SHOPCODE:  load = MAIN,    type = ro,  optional = yes;
    SHOPDATA:  load = MAIN,    type = ro,  optional = yes;

    # In the charset's spare glyphs (see MEMORY): 112, 248 and 424 bytes.
    CHDATA1:  load = CH1,      type = ro,  optional = yes;
    CHDATA2:  load = CH2,      type = ro,  optional = yes;
    CHDATA3:  load = CH3,      type = ro,  optional = yes;

    BSS:      load = BSS,      type = bss, define   = yes;

    OWCBSS:   load = BSS, type = bss, optional = yes;  # the REU cache's scratch (ow_cache.s)
    FIGHTBSS: load = BSS,      type = bss, optional = yes;
    TALKBSS:  load = BSS,      type = bss, optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
