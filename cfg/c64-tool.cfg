# Lean layout for the standalone tools and demos (hello, tiles, charset,
# serialtest). Same reserved regions as the game's config, minus the HIGH
# area and its contiguity padding -- these programs are a couple of kilobytes
# and should stay that way. See cfg/c64-q4k.cfg for the full map.

FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0800;
    __HIMEM__:     type = weak, value = $CF00;   # $CF00-$CFFF: probe page
    __CHARSET__:   type = weak, value = $3800;   # $3800-$3FFF: charset
    __RSBUF__:     type = weak, value = $C500;   # $C500-$C6FF: RS-232 buffers
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $001A;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = __CHARSET__ - __HEADER_LAST__;
    BSS:      file = "",               start = $4000,           size = __RSBUF__ - $4000;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = rw;
    ONCE:     load = MAIN,     type = ro,  define   = yes;
    HICODE:   load = MAIN,     type = ro,  optional = yes;
    HIDATA:   load = MAIN,     type = ro,  optional = yes;
    BSS:      load = BSS,      type = bss, define   = yes;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__, count = __INTERRUPTOR_COUNT__, segment = RODATA, import = __CALLIRQ__;
}
