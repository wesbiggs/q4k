# Quest for the King -- the smooth-scrolling prototype's bootstrap
# (src/openworld.c): one plain load. It shows the splash screen, builds the
# lands into the RAM under the ROMs and then loads an engine over itself
# (include/q4k/ow.h), so nothing of its own has to last; it keeps out of the
# tape buffer, where the loader runs, and of $02A7-$02FF, where it leaves
# what it found.
#
#   $0801-$3FFF  MAIN: everything, the land generator and the splash's
#                libraries too, with the C stack at its top
#   $4000-$91FF  the splash's text and picture, loaded from the disk
#                (OW_SPLASH_AT); afterwards OW-DATA, at $8800-$9FFF, which
#                the engine finds there (cfg/c64-openworld.cfg), and the
#                roads' grid and queue at $4000-$6FFF (src/lib/ow_roads.s)
#   $A000-$AFFF  BSS: below $C000, because the picture is unpacked into
#                $C000-$FFFF, and above what is loaded
#   $B000-$B7FF  LOCAL: local[], where a continent is built (HIDATA: the
#                game's font image, which nothing here reads, so it is not
#                in the file)
#   $D000-$FFF9  the vault, where the lands are built and kept

FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0400;
    __HIMEM__:     type = weak, value = $CF00;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $001A;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = $4000 - __HEADER_LAST__;
    BSS:      file = "",               start = $A000,           size = $1000;
    LOCAL:    file = "",               start = $B000,           size = $0800;
    DISKRUN:  file = "",               start = $CF14,           size = $00EC;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = rw;
    ONCE:     load = MAIN,     type = ro,  define   = yes;
    HICODE:   load = MAIN,     type = ro,  optional = yes;
    HIDATA:   load = LOCAL,    type = ro,  optional = yes;
    MAPCODE:  load = MAIN,     type = ro,  optional = yes;
    MAPDATA:  load = MAIN,     type = ro,  optional = yes;
    CHDATA1:  load = MAIN,     type = ro,  optional = yes;
    CHDATA2:  load = MAIN,     type = ro,  optional = yes;
    CHDATA3:  load = MAIN,     type = ro,  optional = yes;
    BSS:      load = BSS,      type = bss, define   = yes;
    OWCBSS:   load = BSS, type = bss, optional = yes;  # the REU cache's scratch (ow_cache.s)
    BSS2:     load = BSS,      type = bss, optional = yes;
    OWDISK:   load = MAIN,     run = DISKRUN, type = rw, define = yes, optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
