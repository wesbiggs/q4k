# Quest for the King -- the smooth-scrolling prototype's bootstrap
# (src/openworld.c): one plain load. It builds the lands into the RAM under
# the ROMs and then loads an engine over itself (include/q4k/ow.h), so
# nothing of its own has to last; it keeps out of the tape buffer, where the
# loader runs, and of $02A7-$02FF, where it leaves what it found.
#
#   $0801-$BFFF  MAIN: everything, the land generator and its tables too
#   $C000-$CEFF  BSS
#   $D000-$FFF9  the vault, where the lands are built and kept

FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0400;
    __HIMEM__:     type = weak, value = $CF00;
    __SLOT_START__: type = export, value = $4000;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $001A;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = $C000 - __HEADER_LAST__;
    BSS:      file = "",               start = $C000,           size = $CF00 - $C000;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = rw;
    ONCE:     load = MAIN,     type = ro,  define   = yes;
    HICODE:   load = MAIN,     type = ro,  optional = yes;
    HIDATA:   load = MAIN,     type = ro,  optional = yes;
    MAPCODE:  load = MAIN,     type = ro,  optional = yes;
    MAPDATA:  load = MAIN,     type = ro,  optional = yes;
    CHDATA1:  load = MAIN,     type = ro,  optional = yes;
    CHDATA2:  load = MAIN,     type = ro,  optional = yes;
    CHDATA3:  load = MAIN,     type = ro,  optional = yes;
    BSS:      load = BSS,      type = bss, define   = yes;
    BSS2:     load = BSS,      type = bss, optional = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
