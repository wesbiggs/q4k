# Quest for the King -- the offline build's memory layout: engines on the disk.
#
# cfg/c64-q4k.cfg with its OVL replaced by a slot that holds one engine at a
# time (include/q4k/engine.h, ENGINES.md). Everything the game needs all the
# time -- the core -- is in MAIN and HIGH, as before; each engine is linked to
# the slot's address and written to a file of its own, with the two-byte load
# address every PRG starts with, which the Makefile puts on the disk:
#
#   %O        the PRG: MAIN, the charset's gap, the slot holding the title
#             screen (TITLE*), and HIGH
#   %O.map    the map's engine: MAPCODE, MAPDATA
#   %O.fight  the fight's: FIGHTCODE, FIGHTDATA, and its arrays (FIGHTBSS)
#   %O.talk   the talk's: TALKCODE, TALKDATA, and the file it loads (TALKBSS)
#   %O.shop   the shop's: SHOPCODE, SHOPDATA
#
# An engine's variables are not in the slot: modules compiled into an engine
# keep their BSS and DATA in the core's (the Makefile renames only their code
# and constants), so they survive another engine taking the slot. The *BSS
# segments are the exception, scratch that only lasts while its engine runs.
#
#   $0002-$001B  zero page (cc65)
#   $0400-$07E7  screen matrix (VIC bank 0)
#   $0801-$37FF  MAIN: BASIC stub, the core's code, rodata, data
#   $3800-$3FFF  CHARSET, with the core's constants in its spare glyphs
#   $4000-       SLOT: one engine at a time (__SLOTSIZE__)
#        -       HIGH: the rest of the core (__HIGHTOP__)
#        -$CEFF  BSS: every variable, the engines' included
#   $CF00-$CFFF  PROBE page, and BSS2 above what the probe uses
#   $D000-$FFFF  as in cfg/c64-q4k.cfg: home under the I/O, the vault
#
# No RS-232 buffers: the offline build has no modem.

FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0800;   # (see c64-q4k.cfg on the stack)
    __HIMEM__:     type = weak, value = $CF00;
    __CHARSET__:   type = weak, value = $3800;
    __SLOTSIZE__:  type = weak, value = $4400;
    __HIGHTOP__:   type = weak, value = $C400;
    __BSSTOP__:    type = weak, value = $CF00;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $001A;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = __CHARSET__ - __HEADER_LAST__, fill = yes;
    CHARPAD0: file = %O, define = yes, start = __CHARSET__,     size = $0490, fill = yes;
    CH1:      file = %O, define = yes, start = $3C90,           size = $0070, fill = yes;
    CHARPAD1: file = %O, define = yes, start = $3D00,           size = $0008, fill = yes;
    CH2:      file = %O, define = yes, start = $3D08,           size = $00F8, fill = yes;
    CHARPAD2: file = %O, define = yes, start = $3E00,           size = $0040, fill = yes;
    CH3:      file = %O, define = yes, start = $3E40,           size = $01C0, fill = yes;
    # What the slot holds at the start: the title screen, in the PRG.
    SLOT:     file = %O, define = yes, start = $4000,           size = __SLOTSIZE__, fill = yes;
    HIGH:     file = %O, define = yes, start = $4000 + __SLOTSIZE__, size = __HIGHTOP__ - $4000 - __SLOTSIZE__;

    MAPLA:    file = "%O.map",   start = $3FFE, size = $0002;
    MAPE:     file = "%O.map",   define = yes, start = $4000, size = __SLOTSIZE__;
    FIGHTLA:  file = "%O.fight", start = $3FFE, size = $0002;
    FIGHTE:   file = "%O.fight", define = yes, start = $4000, size = __SLOTSIZE__;
    TALKLA:   file = "%O.talk",  start = $3FFE, size = $0002;
    TALKE:    file = "%O.talk",  define = yes, start = $4000, size = __SLOTSIZE__;
    SHOPLA:   file = "%O.shop",  start = $3FFE, size = $0002;
    SHOPE:    file = "%O.shop",  define = yes, start = $4000, size = __SLOTSIZE__;

    BSS:      file = "",               start = __HIGHTOP__,     size = __BSSTOP__ - __HIGHTOP__;
    BSS2:     file = "",               start = $CF14,           size = $00EC;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = rw;
    ONCE:     load = MAIN,     type = ro,  define   = yes;

    BSS2:     load = BSS2,     type = bss, optional = yes;
    HICODE:   load = HIGH,     type = ro,  optional = yes;
    HIDATA:   load = HIGH,     type = ro,  optional = yes;

    TITLECODE: load = SLOT,    type = ro,  optional = yes;
    TITLEDATA: load = SLOT,    type = ro,  optional = yes;

    MAPADDR:   load = MAPLA,   type = ro;
    MAPCODE:   load = MAPE,    type = ro;
    MAPDATA:   load = MAPE,    type = ro,  optional = yes;
    FIGHTADDR: load = FIGHTLA, type = ro;
    FIGHTCODE: load = FIGHTE,  type = ro;
    FIGHTDATA: load = FIGHTE,  type = ro,  optional = yes;
    FIGHTBSS:  load = FIGHTE,  type = bss, define = yes;
    TALKADDR:  load = TALKLA,  type = ro;
    TALKCODE:  load = TALKE,   type = ro;
    TALKDATA:  load = TALKE,   type = ro,  optional = yes;
    TALKBSS:   load = TALKE,   type = bss, define = yes;
    SHOPADDR:  load = SHOPLA,  type = ro;
    SHOPCODE:  load = SHOPE,   type = ro;
    SHOPDATA:  load = SHOPE,   type = ro,  optional = yes;

    CHDATA1:  load = CH1,      type = ro,  optional = yes;
    CHDATA2:  load = CH2,      type = ro,  optional = yes;
    CHDATA3:  load = CH3,      type = ro,  optional = yes;

    BSS:      load = BSS,      type = bss, define   = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
