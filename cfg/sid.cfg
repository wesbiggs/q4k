# A tune for the game, linked where the game keeps one: $E800, under the
# KERNAL, up to $F5FF (past it, the land's fog and the dungeons': q4k/owgame.h). The output
# is the bare image, with no load address; tools/mksid.py wraps it in a PSID
# header. Its variables (BSS) come after the image and are not in the file:
# init sets them.

MEMORY {
    SID: file = %O, define = yes, start = $E800, size = $0E00;
}
SEGMENTS {
    CODE:   load = SID, type = ro;
    RODATA: load = SID, type = ro;
    BSS:    load = SID, type = bss, define = yes;
}
