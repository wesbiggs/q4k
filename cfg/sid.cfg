# A tune for the game, linked where the game keeps one: $E800, under the
# KERNAL, up to $FFF9 (src/lib/music.s). The output is the bare image, with no
# load address; tools/mksid.py wraps it in a PSID header. Its variables
# (BSS) come after the image and are not in the file: init sets them.

MEMORY {
    SID: file = %O, define = yes, start = $E800, size = $17FA;
}
SEGMENTS {
    CODE:   load = SID, type = ro;
    RODATA: load = SID, type = ro;
    BSS:    load = SID, type = bss, define = yes;
}
