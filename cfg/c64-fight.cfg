# Quest for the King -- the multicolour fight (src/fight/, include/q4k/
# fight.h): a module, not a program. One file, loaded at $5400 by whoever
# wants a fight and entered at $5800; it has no BASIC stub and no startup of
# its own, shares the caller's zero page and C stack, and clears its BSS
# itself.
#
#   $4000-$4BFF  the field's file: screen, facts, characters     (not here)
#   $4C00-$4FFF  the letters, copied from the ROM
#   $5000-$53FF  the monster's sprites, a file
#   $5400-$57FF  SPR: the party's sprites and the shots
#   $5800-$BFFF  MAIN: a jump, the block the caller fills in, the fight,
#                then its BSS (the top of it is the RAM under the BASIC
#                ROM, which a cc65 program has switched out)

SYMBOLS {
    __FIGHT_LOAD__: type = export, value = $5400;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002, size = $001A;
    LOADADDR: file = %O,               start = $53FE, size = $0002;
    SPR:      file = %O,               start = $5400, size = $0400, fill = yes;
    MAIN:     file = %O, define = yes, start = $5800, size = $6800;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    FIGHTSPR: load = SPR,      type = ro;
    FIGHTCNR: load = SPR,      type = ro,  start = $5700;   # src/fight/corners.s
    FIGHTHDR: load = MAIN,     type = ro;
    FIGHTBLK: load = MAIN,     type = rw;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    HICODE:   load = MAIN,     type = ro,  optional = yes;
    HIDATA:   load = MAIN,     type = ro,  optional = yes;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = rw,  optional = yes;
    ONCE:     load = MAIN,     type = ro,  optional = yes;
    BSS:      load = MAIN,     type = bss, define = yes;
    OWCBSS:   load = MAIN, type = bss, optional = yes;  # the REU cache's scratch (ow_cache.s)
}
